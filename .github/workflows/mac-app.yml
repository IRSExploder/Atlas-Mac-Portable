# Builds Atlas.app on a Mac, smoke-tests it, and publishes the disk image to the rolling
# `atlas-mac` release, whose download link stays the same from build to build:
#   https://github.com/<owner>/<repo>/releases/download/atlas-mac/Atlas-macOS-arm64.dmg
name: Mac app

on:
  push:
    branches: [main, claude/magical-cannon-j3a3m1]
    paths:
      - "src/**"
      - "packaging/**"
      - "scripts/build_mac.py"
      - "scripts/build_windows.py"
      - "pyproject.toml"
      - ".github/workflows/mac-app.yml"
  workflow_dispatch:

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Apple silicon. An Intel build would need an Intel runner and its own image name.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ATLAS and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[bake,api]" pyinstaller

      - name: Bake the map packs
        run: |
          for source in admin0-50m marine-10m admin1-10m; do
            atlas map bake --source "$source"
          done

      - name: Build, sign, smoke-test and image the app
        run: python scripts/build_mac.py --allow-unpinned

      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-macOS-arm64
          path: dist/Atlas-macOS-arm64.dmg
          retention-days: 14

      - name: Publish to the atlas-mac release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete atlas-mac --yes --cleanup-tag || true
          gh release create atlas-mac dist/Atlas-macOS-arm64.dmg \
            --target "$GITHUB_SHA" --prerelease \
            --title "Atlas for Mac (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Apple silicon (M1 or later), macOS 12+. Not signed with a Developer ID: the first launch needs System Settings > Privacy & Security > Open Anyway."
